<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz: Drogas y Química</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#5d6a85;--pri:#5b4bdb;--ok:#1f9d63;--bad:#d6455d;--bd:#dde3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#eef1fa;--mut:#a3adc7;--pri:#8b7dff;--ok:#3ccf8e;--bad:#ff6b83;--bd:#2d3350}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#eef1fa;--mut:#a3adc7;--pri:#8b7dff;--ok:#3ccf8e;--bad:#ff6b83;--bd:#2d3350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 12px}
p{margin:0 0 10px}.mut{color:var(--mut);font-size:.92rem}
button,input{font:inherit}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;font-size:1rem;margin-top:10px;cursor:pointer}
.btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}
input,textarea{width:100%;padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:8px}
.top{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);width:100%}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:9px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.exp{border-left:4px solid var(--pri);padding:8px 12px;margin-top:12px;background:var(--bg);border-radius:8px}
.big{font-size:2.6rem;font-weight:800;text-align:center;margin:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:8px 0 14px}
.pod div{flex:1;text-align:center;border-radius:12px 12px 0 0;padding:10px 4px;background:var(--bg);border:1px solid var(--bd);min-width:0}
.pod span{display:block;font-size:1.8rem}.pod em{display:block;font-style:normal;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body><main id="app"></main>
<script>
const Q=[
["Desde la química, una droga es una sustancia que…",["Solo existe de forma ilegal","Modifica funciones del organismo al interactuar con células y moléculas","Solo se usa en medicina","No tiene estructura molecular"],1,"Una droga es cualquier sustancia capaz de modificar funciones del organismo; su efecto depende de su estructura molecular."],
["Una sustancia psicoactiva es la que…",["Actúa sobre el sistema nervioso y puede cambiar el ánimo, la percepción o la conducta","Solo actúa en el hígado","Siempre cura enfermedades","No llega al cerebro"],0,"Las sustancias psicoactivas actúan sobre el sistema nervioso. Algunos medicamentos también lo son."],
["¿Cuál es la fórmula molecular de la cafeína?",["C₂H₆O","C₁₀H₁₄N₂","C₈H₁₀N₄O₂","C₂₁H₃₀O₂"],2,"Cafeína: C₈H₁₀N₄O₂ (carbono, hidrógeno, nitrógeno y oxígeno). C₂H₆O es el etanol y C₁₀H₁₄N₂ la nicotina."],
["La cocaína, por su origen, es una droga…",["Sintética","Semisintética","Natural (alcaloide de la hoja de coca)","Un neurotransmisor"],2,"La cocaína es un alcaloide natural presente en las hojas de coca."],
["La heroína es semisintética porque se produce a partir de…",["La cafeína","El THC","La morfina","El etanol"],2,"Semisintética = modificación química de una sustancia natural. La heroína sale de la morfina."],
["Sobre el origen de una droga es correcto decir que…",["Lo natural siempre es seguro","Lo sintético siempre es peor","Que sea natural no la hace segura","El origen decide todos sus efectos"],2,"Los efectos dependen de la estructura molecular, la cantidad, la forma de consumo y factores biológicos, no solo del origen."],
["¿Cómo se llama la zona donde una neurona se comunica con otra?",["Axón","Sinapsis","Receptor","Núcleo"],1,"En la sinapsis se liberan neurotransmisores que se unen a receptores de la neurona siguiente."],
["¿Qué neurotransmisor participa en la motivación, el aprendizaje y la recompensa?",["GABA","Dopamina","Etanol","Nicotina"],1,"La dopamina no es solo “la molécula del placer”: ayuda al cerebro a reconocer experiencias importantes y repetir conductas."],
["En la analogía de la cerradura y la llave, los receptores son…",["Las llaves","Las cerraduras","Las drogas","Las neuronas completas"],1,"Los receptores son las cerraduras y las moléculas (neurotransmisores o drogas) son las llaves que encajan en ellos."],
["La nicotina actúa principalmente sobre los receptores…",["Nicotínicos de acetilcolina","Cannabinoides","De GABA","De insulina"],0,"La nicotina activa receptores que normalmente responden a la acetilcolina."],
["La cocaína aumenta la dopamina disponible porque…",["Produce más GABA","Bloquea las proteínas que retiran la dopamina de la sinapsis","Destruye los receptores","Se transforma en morfina"],1,"Al bloquear la recaptación, la dopamina permanece más tiempo entre las neuronas."],
["El THC del cannabis interactúa con los receptores…",["Nicotínicos","De serotonina únicamente","Cannabinoides","De adrenalina"],2,"El THC (C₂₁H₃₀O₂) se une a receptores del sistema cannabinoide."],
["Cuando la misma cantidad de sustancia produce cada vez menos efecto, hablamos de…",["Abstinencia","Tolerancia","Metabolismo","Prevención"],1,"Tolerancia: el organismo se adapta al consumo repetido. No ocurre igual con todas las sustancias ni personas."],
["El síndrome de abstinencia aparece cuando…",["Se aumenta la dosis","Se consume por primera vez","Se reduce o interrumpe el consumo tras desarrollarse dependencia","Se toma un medicamento recetado"],2,"Sus síntomas varían (ansiedad, irritabilidad, problemas de sueño) y en algunas sustancias puede ser peligroso: requiere atención médica."],
["¿Qué afirmación sobre la drogadicción es correcta?",["Es solo falta de voluntad","Involucra procesos biológicos, químicos y sociales","Solo afecta a los pulmones","No tiene prevención"],1,"Implica cambios en circuitos de recompensa, aprendizaje y autocontrol. Prevenir es informarse, no automedicarse y buscar apoyo."]
];
const TL=20,$=document.getElementById("app");
let i=0,pts=0,ok=0,name="",tm=null,t0=0,done=false,DB=null,shared=null,sub=null;
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function clear(){clearInterval(tm);$.replaceChildren()}
function localGet(){try{return JSON.parse(localStorage.getItem("qd_scores")||"[]")}catch(e){return[]}}
function localAdd(r){try{const a=localGet();a.push(r);a.sort((x,y)=>y.pts-x.pts);localStorage.setItem("qd_scores",JSON.stringify(a.slice(0,30)))}catch(e){}}
function rows(){return shared||localGet().slice(0,10)}
function board(rr,lbl){
  const c=h("div","card"),r=rr||rows();
  c.append(h("h2",null,"🏆 Podio"));
  c.append(h("p","mut",lbl||(shared?"Ranking compartido de todos los jugadores":"Ranking de este dispositivo")));
  if(!r.length){c.append(h("p","mut","Aún no hay resultados."));return c}
  const p=h("div","pod"),ord=[1,0,2],hs=[110,140,90],med=["🥇","🥈","🥉"];
  ord.forEach(k=>{if(!r[k])return;const d=h("div");d.style.height=hs[k]+"px";d.append(h("span",null,med[k]),h("em",null,r[k].name),h("small",null,r[k].pts+" pts"));p.append(d)});
  c.append(p);
  r.slice(3).forEach((x,k)=>{const w=h("div","row");w.append(h("span",null,(k+4)+"."),h("b",null,x.name),h("span",null,x.pts+" pts"));c.append(w)});
  return c}
function hs(s){let a=7;for(const ch of s+"qd26")a=(a*31+ch.charCodeAt(0))%1679616;return a.toString(36).padStart(4,"0")}
function mk(n,p,o){const raw=n+"|"+p+"|"+o;const bin=String.fromCharCode(...new TextEncoder().encode(raw));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")+"."+hs(raw)}
function rd(code){try{const[b,c]=code.trim().split(".");let s=b.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const raw=new TextDecoder().decode(Uint8Array.from(atob(s),x=>x.charCodeAt(0)));if(hs(raw)!==c)return null;const m=raw.split("|"),o=+m.pop(),p=+m.pop();return{name:m.join("|"),pts:p,ok:o}}catch(e){return null}}
function prof(){
  clear();
  const c=h("div","card");c.append(h("h2",null,"👩‍🏫 Modo profesor"),h("p","mut","Pega los códigos de los jugadores, uno por línea."));
  const ta=h("textarea");ta.rows=7;ta.placeholder="Un código por línea";
  try{ta.value=localStorage.getItem("qd_codes")||""}catch(e){}
  const out=h("div"),b=h("button","btn","Armar podio");
  b.onclick=()=>{try{localStorage.setItem("qd_codes",ta.value)}catch(e){}
    const seen=new Set(),good=[],bad=[];
    ta.value.split(/\s+/).filter(Boolean).forEach(l=>{if(seen.has(l))return;seen.add(l);const r=rd(l);r?good.push(r):bad.push(l)});
    good.sort((x,y)=>y.pts-x.pts||y.ok-x.ok);
    out.replaceChildren(board(good,good.length+" jugadores"));
    if(bad.length)out.append(h("p","mut","⚠️ Códigos no válidos: "+bad.length))};
  const v=h("button","btn sec","Volver");v.onclick=start;
  c.append(ta,b);$.append(c,out,v)}
function start(){
  clear();done=false;
  const c=h("div","card");
  c.append(h("h1",null,"🧪 Drogas y Química"),h("p","mut","15 preguntas · 20 segundos cada una · más rápido = más puntos. Después de cada respuesta verás la explicación."));
  const inp=h("input");inp.placeholder="Escribe tu nombre";inp.maxLength=20;inp.value=name;c.append(inp);
  const b=h("button","btn","Jugar");b.onclick=()=>{name=inp.value.trim();if(!name){inp.focus();return}i=0;pts=0;ok=0;ask()};
  const b2=h("button","btn sec","Ver podio");b2.onclick=()=>{clear();$.append(board());const x=h("button","btn","Volver");x.onclick=start;$.append(x)};
  const b3=h("button","btn sec","Modo profesor");b3.onclick=prof;
  c.append(b,b2,b3);$.append(c)}
function ask(){
  clear();const q=Q[i];let locked=false;
  const c=h("div","card"),t=h("div","top");t.append(h("span",null,"Pregunta "+(i+1)+"/15"),h("span",null,"⭐ "+pts));
  const bar=h("div","bar"),fill=h("i");bar.append(fill);
  c.append(t,bar,h("h2",null,q[0]));
  const box=h("div");c.append(box);
  function finish(sel){
    if(locked)return;locked=true;clearInterval(tm);
    const left=Math.max(0,TL-(Date.now()-t0)/1000);
    if(sel===q[2]){ok++;pts+=100+Math.round(50*left/TL)}
    [...box.children].forEach((o,k)=>{o.disabled=true;if(k===q[2])o.classList.add("ok");else if(k===sel)o.classList.add("bad")});
    const e=h("div","exp");e.append(h("b",null,sel===q[2]?"✅ ¡Correcto! ":sel===-1?"⏰ Se acabó el tiempo. ":"❌ Incorrecto. "),document.createTextNode(q[3]));
    const n=h("button","btn",i<14?"Siguiente":"Ver resultado");n.onclick=()=>{i++;i<15?ask():end()};
    c.append(e,n)}
  q[1].forEach((x,k)=>{const o=h("button","opt",x);o.onclick=()=>finish(k);box.append(o)});
  t0=Date.now();
  tm=setInterval(()=>{const l=TL-(Date.now()-t0)/1000;fill.style.width=Math.max(0,l/TL*100)+"%";if(l<=0)finish(-1)},100);
  $.append(c)}
function end(){
  clear();
  const r={name,pts,ok,ts:Date.now()};
  if(!done){done=true;localAdd(r);
    if(DB){try{DB.collection("scores").add(r).catch(()=>{})}catch(e){}}}
  const c=h("div","card");
  c.append(h("h1",null,"¡Terminaste, "+name+"!"),h("div","big",pts+" pts"),h("p","mut",ok+" de 15 correctas"));
  c.append(h("p",null,ok>=13?"🌟 ¡Excelente! Dominas el tema.":ok>=9?"👍 Muy bien, repasa algunos conceptos.":"📚 Repasa la exposición e inténtalo de nuevo."));
  const code=mk(name,pts,ok),cb=h("div","exp");cb.append(h("b",null,"Tu código para el ranking:"));
  const cd=h("p",null,code);cd.style.cssText="font-family:monospace;font-size:1.05rem;word-break:break-all;user-select:all;margin:8px 0";
  const cp=h("button","btn sec","Copiar código");
  cp.onclick=()=>{const f=()=>cp.textContent="Mantén presionado el código para copiarlo";try{navigator.clipboard.writeText(code).then(()=>cp.textContent="¡Copiado! Envíaselo al profesor",f)}catch(e){f()}};
  cb.append(cd,cp);c.append(cb);
  const b=h("button","btn","Jugar otra vez");b.onclick=start;
  $.append(c,board(),b)}
start();
try{
  if(window.claude&&claude.use){claude.use("db").then(db=>{
    if(!db)return;DB=db;
    sub=db.collection("scores").orderBy("pts","desc").limit(10).onSnapshot(s=>{shared=s.docs.map(d=>d.data())},()=>{});
  }).catch(()=>{})}
}catch(e){}
</script></body></html>
